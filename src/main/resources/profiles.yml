      scale: 1.12
      offset-x: 2.45
      offset-y: -0.05
      offset-z: 0.0
      pitch-offset: 0.0
      yaw-offset: -40.0
      roll-offset: 0.0
      curvature: 0.0
      open-duration-ticks: 5
      close-duration-ticks: 4
      teleport-duration-ticks: 2
      camera-distance: 2.05
      camera-height-offset: -0.05
      camera-side-offset: 0.0
      camera-yaw-offset: 26.0
      camera-pitch-offset: 2.0
      min-clearance: 1.15
      camera-teleport-duration-ticks: 4
      avatar-body-yaw-offset: 0.0
      head-track-hovered-slot: true
      fallback-to-first-person-on-occlusion: true
      open-transition-ticks: 10
