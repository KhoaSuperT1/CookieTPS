profiles:
  CHEST:
    view-mode: AUTO
    enabled: true
    columns: 9
    rows: 3
    slot-spacing: 0.24
    show-background: true
    show-tooltips: true
    include-player-inventory: true
    first-person:
      distance: 2.2
      scale: 0.76
      offset-x: -0.3
      offset-y: 0.14
      offset-z: 0.0
